<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket 80 mm — RJ-3050Ai</title>

  <style>
    :root {
      --paper: 80mm;      /* Tamaño real del rollo */
      --w: 78mm;          /* Área de contenido (máximo) */
      --font: "Courier New", monospace;

      /* Tamaños optimizados */
      --fs: 3.4mm;
      --fs-head: 5.2mm;
      --fs-sub: 3mm;
      --line: #000;
    }

    * { box-sizing: border-box; -webkit-print-color-adjust: exact; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: var(--font);
      font-size: var(--fs);
      width: var(--paper);
    }

    #ticket {
      width: var(--w);
      margin: 0 auto;
      padding: 1.5mm;
      line-height: 1.15;
    }

    .store-header { text-align:center; }
    .store-title { font-size: var(--fs-head); font-weight:700; margin:1mm 0; }
    .store-details { font-size: var(--fs-sub); white-space:pre-line; }

    .divider {
      border-top: 0.35mm dashed var(--line);
      margin: 2mm 0;
    }

    /* Logo */
    .logo { max-width: 50mm; margin: 0 auto 1mm; display: none; }

    /* Tabla de productos */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1mm;
      table-layout: fixed;
    }

    thead th {
      font-size: var(--fs);
      border-bottom: 0.35mm solid var(--line);
      padding-bottom: 1mm;
    }

    .qty-col { width: 12mm; text-align:right; font-weight:700; }
    .desc-col { width: calc(100% - 12mm - 20mm); padding-left:1mm; }
    .total-col { width: 20mm; text-align:right; font-weight:700; }

    td { padding-top: 1mm; vertical-align: top; }

    .item-name { font-size: var(--fs); font-weight:700; }
    .meta-line { display:flex; justify-content:space-between; font-size: var(--fs-sub); }

    .upc-inline { font-weight:700; }

    .line-row { border-bottom: 0.35mm dashed #000; }
    .line-row:last-child { border-bottom: none; }

    /* Totales */
    .totals { margin-top: 2mm; font-size: var(--fs); }
    .total-line {
      display:flex;
      justify-content: space-between;
      margin-top: 1mm;
    }

    .total-line.bold span:last-child {
      font-size: calc(var(--fs) + 1.2mm);
      font-weight: 800;
    }

    .footer { text-align:center; margin-top:2mm; font-size: var(--fs-sub); white-space:pre-line; }

    @media print {
      #uiBtns { display:none !important; }
      @page { size: var(--paper) auto; margin: 0; }
    }

    #uiBtns {
      position: fixed;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 6px 10px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #000;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font);
    }

    .btn-green {
      background: #eaffea;
      border-color: #0a0;
      color:#0a0;
    }
  </style>
</head>

<body>
  <div id="ticket">

    <!-- Encabezado -->
    <div class="store-header">
      <img id="logo" class="logo" />
      <div id="store_title" class="store-title"></div>
      <div id="store_details" class="store-details"></div>
    </div>

    <div class="divider"></div>

    <!-- Info -->
    <div>
      <div><b>Fecha:</b> <span id="fecha_text"></span></div>
      <div><b>Factura No.:</b> <span id="factura_text"></span></div>
      <div id="cliente_wrap" style="display:none;"><b>Cliente:</b> <span id="cliente_text"></span></div>
      <div id="dir_wrap" style="display:none;"><b>Dirección:</b> <span id="dir_text"></span></div>
      <div id="pago_wrap" style="display:none;"><b>Pago:</b> <span id="pago_text"></span></div>
    </div>

    <div class="divider"></div>

    <!-- Tabla productos -->
    <table>
      <thead>
        <tr>
          <th class="qty-col">QTY</th>
          <th class="desc-col">DESCRIPCIÓN</th>
          <th class="total-col">TOTAL</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <!-- Totales -->
    <div class="totals">
      <div class="total-line"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
      <div class="total-line"><span>Total Unidades</span><span id="units">0</span></div>
      <div class="total-line bold"><span>TOTAL A PAGAR</span><span id="grand">$0.00</span></div>
    </div>

    <div class="divider"></div>

    <div class="footer" id="footer_text"></div>

  </div>

  <!-- Botones -->
  <div id="uiBtns">
    <button id="printBtn" class="btn">Imprimir</button>
    <button id="shareBtn" class="btn btn-green">Compartir PDF</button>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script>
    /* ------------ UTILIDADES ------------ */
    const q = new URLSearchParams(location.search);
    const fmt = v => "$" + Number(v || 0).toFixed(2);
    const splitAny = s => String(s || "").split(/[;,]/).map(x=>x.trim()).filter(x=>x);
    const num = s => parseFloat(String(s||"").replace(/[^0-9.\-]/g,"")) || 0;

    /* ------------ LECTURA DATOS ------------ */
    const titulo = q.get("titulo") || "Gellis Distributor, Inc";
    const detalles = (q.get("detalles") || "Belleville, NJ 07109\nTel: 973-652-5547").replace(/\n/g,"\n");
    const fecha = q.get("fecha") || new Date().toLocaleDateString();
    const factura = q.get("boleta") || "-";
    const nota = q.get("nota") || "¡Gracias por su compra!";

    const cantidades = splitAny(q.get("cantidades"));
    const desc = splitAny(q.get("servicios"));
    const upc = splitAny(q.get("upcs"));
    const prices = splitAny(q.get("p_unit"));

    /* ------------ RENDER ------------ */
    document.getElementById("store_title").textContent = titulo;
    document.getElementById("store_details").textContent = detalles;
    document.getElementById("fecha_text").textContent = fecha;
    document.getElementById("factura_text").textContent = factura;
    document.getElementById("footer_text").textContent = nota;

    let subtotal = 0, units = 0;
    const tbody = document.getElementById("tbody");

    for (let i = 0; i < desc.length; i++) {
      const qty = num(cantidades[i]);
      const name = desc[i];
      const price = num(prices[i]);
      const code = upc[i] || "";
      const line = qty * price;
      if (!qty || !name) continue;

      subtotal += line;
      units += qty;

      const tr = document.createElement("tr");
      tr.className = "line-row";
      tr.innerHTML = `
        <td class="qty-col">${qty}</td>
        <td class="desc-col">
          <span class="item-name">${name}</span>
          <div class="meta-line">
            <span>${fmt(price)}</span>
            ${code ? `<span class="upc-inline">${code}</span>` : ""}
          </div>
        </td>
        <td class="total-col">${fmt(line)}</td>
      `;
      tbody.appendChild(tr);
    }

    document.getElementById("subtotal").textContent = fmt(subtotal);
    document.getElementById("units").textContent = units;
    document.getElementById("grand").textContent = fmt(subtotal);

    /* ------------ IMPRESIÓN / PDF ------------ */
    document.getElementById("printBtn").onclick = () => window.print();

    document.getElementById("shareBtn").onclick = async () => {
      const ticket = document.getElementById("ticket");
      const canvas = await html2canvas(ticket, { scale: 4 });
      const img = canvas.toDataURL("image/png");

      const pdf = new jspdf.jsPDF({
        unit: "mm",
        format: [80, (canvas.height / canvas.width) * 78]
      });

      pdf.addImage(img, "PNG", 1, 0, 78, (canvas.height / canvas.width) * 78);
      pdf.save("ticket_80mm.pdf");
    };
  </script>
</body>
</html>
