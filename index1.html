<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Factura</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #000 !important; /* 🔥 TODAS LAS LETRAS EN NEGRO */
    }

    h1, h2, h3, h4, p, td, th, div, span {
        color: #000 !important; /* 🔥 FORZAR TEXTO NEGRO */
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        color: #000 !important;
    }

    th, td {
        border: 1px solid #000 !important;
        padding: 6px;
        text-align: left;
        color: #000 !important;
    }

    .btn {
        margin-top: 20px;
        padding: 12px;
        width: 100%;
        background: #1a73e8;
        color: white !important;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
    }

    .btn:hover {
        background: #0c57b5;
    }
</style>
</head>

<body>

    <h2>Factura Comercial</h2>

    <div>
        <p><strong>Empresa:</strong> Mi Empresa</p>
        <p><strong>Cliente:</strong> Juan Pérez</p>
        <p><strong>Número de Factura:</strong> 000123</p>
        <p><strong>Fecha:</strong> 2025-11-27</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Cant.</th>
                <th>Descripción</th>
                <th>Costo</th>
                <th>Retail</th>
                <th>UPC</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>2</td>
                <td>Producto A</td>
                <td>10.00</td>
                <td>12.00</td>
                <td>123456789</td>
                <td>24.00</td>
            </tr>

            <tr>
                <td>1</td>
                <td>Producto B</td>
                <td>5.00</td>
                <td>7.00</td>
                <td>987654321</td>
                <td>7.00</td>
            </tr>
        </tbody>
    </table>

    <h3>Total a pagar: $31.00</h3>

    <!-- 🔥 BOTÓN PARA IMPRIMIR / ABRIR EN PDF (COMPATIBLE CON BROTHER PRINT EN IPHONE) -->
    <button class="btn" onclick="exportPDF()">Enviar a Brother Print</button>

<script>
function exportPDF() {
    // Crear el PDF desde la página
    const printContent = document.body.innerHTML;
    const ventana = window.open("", "_blank");

    ventana.document.write(`
        <html>
        <head><title>Factura</title></head>
        <body>${printContent}</body>
        </html>
    `);

    ventana.document.close();

    // 🔥 iPhone + Brother App requiere usar print(), NO automáticamente descargar PDF
    ventana.focus();
    ventana.print(); 
}
</script>

</body>
</html>
