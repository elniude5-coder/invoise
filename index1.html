<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticket — Brother RJ-3050Ai</title>

<style>
:root{
  --paper: 80mm;
  --w: 78mm;
  --font: "Courier New", monospace;
  --fs: 3.8mm;
  --fs-head: 6.0mm;
  --fs-sub: 3.5mm;
  --line: #000;
  --pad: 1mm;
}
*{
  box-sizing:border-box;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  color:#000 !important;
}
html,body{
  margin:0; padding:0;
  background:#fff;
  font-family:var(--font);
  font-size:var(--fs);
  width:var(--paper);
}
#ticket{
  width:var(--w);
  max-width:var(--w);
  padding:var(--pad);
  margin:0 auto;
}
.store-header{text-align:center;margin-bottom:2mm;}
.store-title{
  font-size:var(--fs-head);
  font-weight:900;
  margin:0;
  text-transform:uppercase;
}
.store-details{
  font-size:var(--fs-sub);
  line-height:1.1;
  margin-top:.5mm;
  word-break:break-word;
}
.logo{
  max-width:50mm;
  max-height:18mm;
  margin:0 auto 1mm;
  display:none;
}
.divider{
  border-top:.25mm dashed #000;
  margin:1.5mm 0;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
thead th{
  font-size:var(--fs);
  border-bottom:.25mm solid #000;
  padding-bottom:.6mm;
}
.qty-col{
  width:14mm;
  text-align:right;
  padding-right:1mm;
}
.desc-col{
  width:calc(100% - 14mm - 18mm);
}
.total-col{
  width:18mm;
  text-align:right;
}

td{
  padding-top:.7mm;
  font-size:var(--fs-sub);
}
.item-name{
  font-size:calc(var(--fs) + .5mm);
  font-weight:900;
}
.meta-line{
  display:flex;
  justify-content:space-between;
  font-size:var(--fs-sub);
  margin-top:.2mm;
}
.unit-price{font-weight:900;}
.upc-inline{font-weight:900;}

.totals{
  margin-top:2mm;
  font-size:var(--fs);
  font-weight:900;
}
.total-line{
  display:flex;
  justify-content:space-between;
  margin-top:1mm;
}
.total-line.bold span:last-child{
  font-size:calc(var(--fs) + 2mm);
}

.footer{
  text-align:center;
  margin-top:2mm;
  font-size:var(--fs-sub);
}

@media print{
  #uiBtns{display:none!important;}
  @page{ size:var(--paper) auto; margin:0; }
}

#uiBtns{
  position:fixed;
  right:8px;
  bottom:8px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.btn{
  padding:6px 10px;
  border-radius:6px;
  border:1px solid #000;
  background:#fff;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}
.btn-green{
  border-color:#070;
  color:#070;
  background:#eaffea;
}
</style>
</head>

<body>

<div id="ticket">
  <div class="store-header">
    <img id="logo" class="logo" />
    <div id="store_title" class="store-title">Tienda</div>
    <div id="store_details" class="store-details"></div>
  </div>

  <div class="divider"></div>

  <div>
    <div><b>Fecha:</b> <span id="fecha_text"></span></div>
    <div><b>Factura No.:</b> <span id="factura_text"></span></div>
    <div id="cliente_wrap" style="display:none;"><b>Cliente:</b> <span id="cliente_text"></span></div>
    <div id="dir_wrap" style="display:none;"><b>Dirección:</b> <span id="dir_text"></span></div>
    <div id="pago_wrap" style="display:none;"><b>Pago:</b> <span id="pago_text"></span></div>
  </div>

  <div class="divider"></div>

  <table>
    <thead>
      <tr>
        <th class="qty-col">QTY</th>
        <th class="desc-col">DESCRIPCIÓN</th>
        <th class="total-col">TOTAL</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="totals">
    <div class="total-line"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
    <div class="total-line"><span>Total Unidades</span><span id="units">0</span></div>
    <div class="total-line bold"><span>TOTAL A PAGAR</span><span id="grand">$0.00</span></div>
  </div>

  <div class="divider"></div>

  <div class="footer">
    <span id="nota_text"></span><br>
    <span id="estado_text"></span>
  </div>
</div>

<div id="uiBtns">
  <button id="printBtn" class="btn">Imprimir (AirPrint)</button>
  <button id="shareBtn" class="btn btn-green">Generar PDF</button>
</div>

<!-- LIBRERÍAS -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
const fmt = (v,c)=>`${c}${Number(v||0).toFixed(2)}`;
const splitAny = s => String(s||"").split(/[;,]/).map(x=>x.trim()).filter(x=>x!=="");
const num = s => parseFloat((s||"").replace(/[^\d.-]/g,""))||0;
const set = (id,val)=>document.getElementById(id).textContent=val;
const show=(id,v)=>document.getElementById(id).style.display=v?"block":"none";

const q = new URLSearchParams(location.search);

const ancho = [76,80].includes(parseInt(q.get("ancho"))) ? parseInt(q.get("ancho")) : 80;
document.documentElement.style.setProperty("--paper", ancho+"mm");
document.documentElement.style.setProperty("--w", ancho===80 ? "78mm" : "74mm");

const titulo = q.get("titulo") || "Tienda";
const detalles = q.get("detalles") || "";
const logo = q.get("logo") || "";
const fecha = q.get("fecha") || "";
const cliente = q.get("cliente") || "";
const direccion = q.get("direccion") || "";
const factura = q.get("boleta") || "";
const pago = q.get("pago") || "";
const estado = q.get("estado") || "";
const nota = q.get("nota") || "¡Gracias por su compra!";
const curr = q.get("moneda") || "$";

let qtys = splitAny(q.get("cantidades"));
let desc = splitAny(q.get("servicios"));
let upcs = splitAny(q.get("upcs"));
let units = splitAny(q.get("p_unit"));

document.getElementById("store_title").textContent=titulo;
document.getElementById("store_details").innerHTML=detalles.replace(/\n/g,"<br>");

if(logo){
  const img=document.getElementById("logo");
  img.src=logo;
  img.style.display="block";
}

set("fecha_text",fecha);
set("factura_text",factura);

if(cliente){ show("cliente_wrap",true); set("cliente_text",cliente); }
if(direccion){ show("dir_wrap",true); set("dir_text",direccion); }
if(pago){ show("pago_wrap",true); set("pago_text",pago); }

set("estado_text",estado);
set("nota_text",nota);

const tbody=document.getElementById("tbody");
let totalUnits=0;
let subtotal=0;

for(let i=0;i<desc.length;i++){
  const qv=num(qtys[i]);
  const nm=desc[i];
  const up=upcs[i]||"";
  const pu=num(units[i]);

  if(qv>0 && nm){
    const line = qv*pu;
    subtotal+=line;
    totalUnits+=qv;

    const tr=document.createElement("tr");
    tr.innerHTML = `
      <td class="qty-col">${qv}</td>
      <td class="desc-col">
        <div class="item-name">${nm}</div>
        <div class="meta-line">
          <span>${fmt(pu,curr)}</span>
          ${up?`<span class="upc-inline">${up}</span>`:""}
        </div>
      </td>
      <td class="total-col">${fmt(line,curr)}</td>
    `;
    tbody.appendChild(tr);
  }
}

set("subtotal",fmt(subtotal,curr));
set("units",totalUnits);
set("grand",fmt(subtotal,curr));

document.getElementById("printBtn").onclick=()=>window.print();

document.getElementById("shareBtn").onclick=async()=>{
  const ticket=document.getElementById("ticket");
  const canvas=await html2canvas(ticket,{scale:4});
  const img=canvas.toDataURL("image/png");
  const {jsPDF}=window.jspdf;

  const W=ancho;
  const contentW = ancho===80?78:74;
  const ratio = canvas.height/canvas.width;
  const contentH = contentW*ratio;

  const doc=new jsPDF({
    unit:"mm",
    format:[W, 200],
    compress:false
  });

  doc.addImage(img,"PNG",(W-contentW)/2,2,contentW,contentH,"","FAST");

  const blob=doc.output("blob");
  const file=new File([blob],"ticket.pdf",{type:"application/pdf"});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({files:[file],title:"Ticket"});
  }else{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="ticket.pdf"; a.click();
    URL.revokeObjectURL(url);
  }
};
</script>

</body>
</html>
