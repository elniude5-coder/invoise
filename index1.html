<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticket 80mm — Brother RJ-3050Ai</title>

<style>
  :root{
    --paper: 80mm;      /* Tamaño real RJ-3050Ai */
    --w: 78mm;          /* Contenido casi completo, solo 1mm de margen */
    --font: "Courier New", ui-monospace, monospace;

    /* TAMAÑOS DE LETRA MEJORADOS */
    --fs: 4.2mm;        /* Texto normal */
    --fs-head: 6mm;     /* Título */
    --fs-sub: 3.8mm;    /* Subtexto */
  }

  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  body{
    margin:0; padding:0; width:var(--paper);
    font-family:var(--font); color:#000; background:#fff;
    font-size:var(--fs);
    font-weight:700;
  }

  #ticket{
    width:var(--w);
    max-width:var(--w);
    margin:0 auto;
    padding:1mm;
  }

  .store-header{ text-align:center; margin-bottom:2mm; }
  .store-title{ font-size:var(--fs-head); font-weight:800; margin:1mm 0 0; }
  .store-details{ font-size:var(--fs-sub); line-height:1.2; }

  .divider{ border-top:.4mm dashed #000; margin:2mm 0; }

  table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  thead th{
    border-bottom:.4mm solid #000;
    padding-bottom:1mm;
    font-size:var(--fs);
    font-weight:800;
  }

  /* COLUMNAS MÁS ANCHAS */
  .qty-col{ width:12mm; text-align:right; padding-right:1mm; }
  .desc-col{ width:calc(100% - 12mm - 22mm); }
  .total-col{ width:22mm; text-align:right; }

  td{ font-size:var(--fs-sub); padding-top:1mm; }
  .item-name{ font-size:var(--fs); font-weight:800; display:block; }
  .meta-line{ font-size:var(--fs-sub); display:flex; justify-content:space-between; }

  /* Totales grandes */
  .total-line{ display:flex; justify-content:space-between; margin-top:1mm; }
  .bold span:last-child{
    font-size:calc(var(--fs) + 1.6mm);
    font-weight:900;
  }

  @media print{
    #uiBtns{ display:none !important; }
    @page{ size:var(--paper) auto; margin:0; }
  }

  #uiBtns{
    position:fixed; right:10px; bottom:10px; display:flex; flex-direction:column; gap:8px;
  }
  .btn{
    padding:8px 14px; font-size:14px; font-weight:700;
    border-radius:6px; border:1px solid #000; background:#fff; cursor:pointer;
  }
  .btn-green{ color:#080; border-color:#080; background:#eaffea; }
</style>
</head>
<body>

<div id="ticket">

  <div class="store-header">
    <img id="logo" class="logo" style="max-width:45mm; display:none;" />
    <div id="store_title" class="store-title">Gellis Distributor, Inc</div>
    <div id="store_details" class="store-details">Belleville, NJ 07109<br>Tel: 973-652-5547</div>
  </div>

  <div class="divider"></div>

  <div>
    <b>Fecha:</b> <span id="fecha_text"></span><br>
    <b>Factura No.:</b> <span id="factura_text"></span><br>
    <div id="cliente_wrap" style="display:none;"><b>Cliente:</b> <span id="cliente_text"></span></div>
    <div id="dir_wrap" style="display:none;"><b>Dirección:</b> <span id="dir_text"></span></div>
  </div>

  <div class="divider"></div>

  <table>
    <thead>
      <tr>
        <th class="qty-col">QTY</th>
        <th class="desc-col">DESCRIPCIÓN</th>
        <th class="total-col">TOTAL</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="divider"></div>

  <div class="total-line"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
  <div class="total-line"><span>Total Unidades</span><span id="units">0</span></div>
  <div class="total-line bold"><span>TOTAL A PAGAR</span><span id="grand">$0.00</span></div>

  <div class="divider"></div>
  <div style="text-align:center; font-size:var(--fs-sub);">
    <span id="nota_text">¡Gracias por su compra!</span>
  </div>
</div>

<div id="uiBtns">
  <button id="printBtn" class="btn">Imprimir</button>
</div>

<script>
  /* ---------------------------
     CARGA DE DATOS DESDE LA URL
     --------------------------- */
  const q = new URLSearchParams(location.search);

  const titulo = q.get("titulo") || "Gellis Distributor, Inc";
  const detalles = q.get("detalles") || "Belleville, NJ 07109\nTel: 973-652-5547";
  const fecha = q.get("fecha") || new Date().toLocaleDateString("en-US");
  const factura = q.get("boleta") || "-";

  document.getElementById("store_title").textContent = titulo;
  document.getElementById("store_details").innerHTML = detalles.replace(/\n/g,"<br>");
  document.getElementById("fecha_text").textContent = fecha;
  document.getElementById("factura_text").textContent = factura;

  /* ITEMS */
  const cantidades = (q.get("cantidades") || "").split(";");
  const desc = (q.get("servicios") || "").split(";");
  const precios = (q.get("p_unit") || "").split(";");

  const tbody = document.getElementById("tbody");
  let subtotal = 0, units = 0;
  const fmt = v => "$" + Number(v).toFixed(2);

  for(let i=0;i<desc.length;i++){
    const qty = Number(cantidades[i] || 0);
    const name = desc[i] || "";
    const price = Number(precios[i] || 0);
    const total = qty * price;

    if(!qty || !name) continue;

    subtotal += total;
    units += qty;

    tbody.innerHTML += `
      <tr>
        <td class="qty-col">${qty}</td>
        <td class="desc-col">
          <span class="item-name">${name}</span>
          <div class="meta-line">${fmt(price)}</div>
        </td>
        <td class="total-col">${fmt(total)}</td>
      </tr>
    `;
  }

  document.getElementById("subtotal").textContent = fmt(subtotal);
  document.getElementById("units").textContent = units;
  document.getElementById("grand").textContent = fmt(subtotal);

  document.getElementById("printBtn").onclick = ()=>window.print();
</script>

</body>
</html>
