<!-- Botón para imprimir con Brother -->
<button id="btnBrother" 
        style="width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:6px;font-size:18px;margin-top:20px;">
    Imprimir en Brother
</button>

<script>
// Cuando se genere el PDF, lo guardamos en una variable
let pdfURL = "";

// Sobreescribimos la función que genera el PDF (si ya existe)
function generarPDF_Final(url) {
    pdfURL = url;
    console.log("PDF listo:", pdfURL);
}

// Evento del botón
document.getElementById("btnBrother").addEventListener("click", () => {
    if (!pdfURL || pdfURL === "") {
        alert("El PDF todavía no está listo.");
        return;
    }

    // Abrir Impresora Brother
    const brotherURL = `brother-print://print?file=${encodeURIComponent(pdfURL)}`;
    console.log("Enviando a Brother:", brotherURL);

    window.location.href = brotherURL;
});
</script>
