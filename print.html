<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Imprimir Brother</title>

<style>
body { font-family: Arial; padding: 20px; }
#ticket { border: 1px solid #ccc; padding: 15px; width: 300px; }
</style>

</head>
<body>

<h2>RECIBO</h2>

<div id="ticket">
  <p><strong>Factura:</strong> <span id="factura"></span></p>
  <p><strong>Cliente:</strong> <span id="cliente"></span></p>
  <p><strong>Dirección:</strong> <span id="direccion"></span></p>
  <p><strong>Fecha:</strong> <span id="fecha"></span></p>

  <hr>

  <div id="items"></div>

  <hr>
  <p><strong>Total:</strong> <span id="total"></span></p>
</div>

<script>
function g(param) {
    return new URLSearchParams(window.location.search).get(param) || "";
}

document.getElementById("factura").innerText = g("factura");
document.getElementById("cliente").innerText = g("cliente");
document.getElementById("direccion").innerText = g("direccion");
document.getElementById("fecha").innerText = g("fecha");

let nombres = g("nombres").split(",");
let cantidades = g("cantidades").split(",");
let precios = g("precios").split(",");

let total = 0;
let html = "";

for (let i = 0; i < nombres.length; i++) {
    let p = parseFloat(precios[i] || 0);
    let c = parseInt(cantidades[i] || 1);
    total += (p * c);

    html += `
      <p>${c} x ${nombres[i]} — ${p.toFixed(2)}</p>
    `;
}

document.getElementById("items").innerHTML = html;
document.getElementById("total").innerText = total.toFixed(2);

// Abre Brother iPrint
setTimeout(() => {
    window.location.href = "brotherprint://print";
}, 1200);
</script>

</body>
</html>
